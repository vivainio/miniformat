name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      python-versions: '["3.10", "3.14"]'

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set version from release tag
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" miniformat/loader.py
          grep '^__version__' miniformat/loader.py

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
